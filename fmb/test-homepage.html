<script>
  window.googletag = window.googletag || {cmd: []};
  
  (function() {
    var lockoutPaths = [
      "/",
      "/features/what-makes-mountain-biking-in-alice-springs-so-special/",
      "/post-all/shimano-gravel-muster-2026/"
    ];

    var path = window.location.pathname;
    var isMatched = lockoutPaths.some(function(item) {
      return item === "/" ? path === "/" : path.includes(item);
    });

    var postid = "<?php global $post; echo $post ? $post->ID : ''; ?>";
    var sponsored = isMatched ? "Y" : "N";
    var fn_pageskin = (screen.width >= 1580) ? "true" : "false";
    var pageTitle = (path.split('/').filter(Boolean).map(decodeURIComponent).at(-1) || 'default-title').slice(0, 39);
    var adtest = (new URLSearchParams(window.location.search)).get('adtest') ?? 'false';

    window.gamPage = {
      targeting: { postid, sponsored, inskin_yes: fn_pageskin, title: pageTitle, adtest }
    };
  })();

  googletag.cmd.push(function() {
    // Single-line cleanup: converts to entries, filters out empty/undefined values, and rebuilds the object
    var cleanTargeting = Object.fromEntries(
      Object.entries(window.gamPage.targeting).filter(([_, v]) => v !== undefined && v !== '')
    );
    googletag.setConfig({ targeting: cleanTargeting });
  });
</script>
