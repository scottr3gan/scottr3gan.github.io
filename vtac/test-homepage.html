<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />



<!--- Start: Google Publisher tag header script --->
<script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js" crossorigin="anonymous"></script> 
<script>
    window.googletag = window.googletag || {cmd: []};

    var path = window.location.pathname;  
    var pageTitle = (path.split('/').filter(Boolean).map(decodeURIComponent).at(-1) || 'default-title').slice(0, 39);
    var kvAdTest = (new URLSearchParams(window.location.search)).get('adtest') ?? 'false';
    
    // Prepare all targeting and size mapping
    const gamData = {
      "adUnit": "/22917295869/VTAC/home",
      "kv": {
        "institution": "monash",
        "loggedin": "Y",
        "title": pageTitle,
        "adtest": kvAdTest
        },
      "sizeMap": {
        "largesquare":[[[0,0],[350,350]]],
        "billboard":[[[992,0],[970,250]],[[0,0],[300,250]]],
        "leaderboard":[[[1200,0],[728,90]],[[0,0],[300,250]]],
        "largerec":[[[1200,0],[650,300]],[[0,0],[300,250]]],
        "custom":[[[0,0],[300,250]]]
        }
      }
      
    // Set page-level key-values and GPT settings
    document.addEventListener('DOMContentLoaded', () => {
      googletag.cmd.push(function() {
          googletag.setConfig({
            targeting: gamData ? gamData.kv : {},
              collapseDiv: 'ON_NO_FILL',
              centering: true,
              lazyLoad: {
                  fetchMarginPercent: 200, 
                  renderMarginPercent: 50, 
                  mobileScaling: 2.0 
              }
          });
      googletag.enableServices();

        // Refresh ads on screen size changes
        const breakpoints = [576, 768, 992, 1200, 1400];
        let lastW = window.innerWidth;
        let resizeTimeout;

      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            const currW = window.innerWidth;
            const crossed = breakpoints.some(bp => (lastW < bp && currW >= bp) || (lastW >= bp && currW < bp));
            if (crossed) {
                console.log(`Breakpoint crossed. Refreshing all ads.`);
                lastW = currW;
                googletag.pubads().refresh(); 
          }
        }, 200); 
        });
      });
    });
<!--- End: Google Publisher tag header script --->

</head>
<body>



<div id="gam_billboard_pos1">
  <script>
    googletag.cmd.push(function () {
      googletag.defineSlot(gamData.adUnit, [970, 250], 'gam_billboard_pos1')
        .defineSizeMapping(gamData.sizeMap.billboard)
        .setConfig({ targeting: {'pos': ['1']} })
        .addService(googletag.pubads());
    googletag.display('gam_billboard_pos1');
  });
  </script>
</div>
