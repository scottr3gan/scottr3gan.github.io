name: Secure Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject No-Index Meta Tags
        run: |
          echo "Scanning all directories for HTML files..."
          
          # Force match tracking targets explicitly
          TARGET_TAG='<meta name="robots" content="noindex, nofollow, noarchive">'
          
          # Recursively find every HTML file, regardless of folder depth
          find . -type f -name "*.html" | while read -r file; do
            # Convert file path to lowercase for safe checking
            if ! grep -q -i 'name="robots"' "$file"; then
              echo "Target found: Modifying $file"
              
              # This covers <head>, <HEAD>, and spaces like <head   >
              sed -i -E 's/(<head[^>]*>)/\1\n    <meta name="robots" content="noindex, nofollow, noarchive">/I' "$file"
            else
              echo "Skipping protected layout: $file"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4